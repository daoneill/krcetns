<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery & Student Showcase | Killester Park Dublin 5</title>
  <meta name="description" content="Explore photos of student activities, classroom projects, sports days, and events at Killester Park Educate Together National School.">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/styles.css?v=20260906d">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Shared Site Header Container -->
  <div id="siteHeader"></div>

  <!-- Page Banner -->
  <section class="page-header-banner">
    <div class="page-header-container">
      <h1 class="page-header-title">Photo Gallery & Showcase</h1>
      <p class="page-header-subtitle">A visual glimpse into daily learning, creativity, and school events.</p>
    </div>
  </section>

  <!-- Photo Gallery Section -->
  <section class="section">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">Visual Showcase</span>
        <h2 class="section-title">School Photo Gallery</h2>
        <p class="section-description">Click any photo to enlarge in full-screen lightbox view.</p>
      </div>

      <div class="card-grid" id="photoGalleryGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem;">
        <a href="images/hero.png" data-lightbox data-title="Art Appreciation - Francis Bacon Inspired Work" style="border-radius: 14px; overflow: hidden; height: 180px; box-shadow: var(--shadow-sm);">
          <img src="images/hero.png" alt="Student Artwork" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        </a>

        <a href="images/hero.png" data-lightbox data-title="Active School Day Playground Fun" style="border-radius: 14px; overflow: hidden; height: 180px; box-shadow: var(--shadow-sm);">
          <img src="images/hero.png" alt="Playground Activity" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        </a>

        <a href="images/hero.png" data-lightbox data-title="Green Schools Biodiversity Workshop" style="border-radius: 14px; overflow: hidden; height: 180px; box-shadow: var(--shadow-sm);">
          <img src="images/hero.png" alt="Green Schools Project" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        </a>

        <a href="images/hero.png" data-lightbox data-title="Classroom Science Experiment" style="border-radius: 14px; overflow: hidden; height: 180px; box-shadow: var(--shadow-sm);">
          <img src="images/hero.png" alt="Science Experiment" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        </a>
      </div>
    </div>
  </section>

  <!-- Shared Site Footer Container -->
  <div id="siteFooter"></div>

  <script src="js/main.js"></script>
</body>
</html>
