<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest News & Announcements | Killester Park Dublin 5</title>
  <meta name="description" content="Stay up to date with the latest news, announcements, and classroom stories at Killester Park Educate Together National School.">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="canonical" href="https://killesterparketns.ie/news.html">
  <link rel="stylesheet" href="css/styles.css?v=20260916_blue">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Shared Site Header Container -->
  <div id="siteHeader"></div>

  <!-- Page Banner -->
  <section class="page-header-banner">
    <div class="page-header-container">
      <h1 class="page-header-title">Latest News & Announcements</h1>
      <p class="page-header-subtitle">Stay connected with recent updates, student projects, and school activities.</p>
    </div>
  </section>

  <!-- News Section with Category Filter -->
  <section class="section">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">School Feed</span>
        <h2 class="section-title">Latest School News</h2>
      </div>

      <!-- Filter & Search Bar -->
      <div style="max-width: 600px; margin: 0 auto 2rem;">
        <input type="text" id="newsSearchInput" class="form-input" placeholder="Search news by keyword (e.g. Admissions, Art, Sports)...">
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All Posts</button>
        <button class="filter-btn" data-filter="admissions">Admissions</button>
        <button class="filter-btn" data-filter="art">Art & Curriculum</button>
        <button class="filter-btn" data-filter="events">Events & Sports</button>
      </div>

      <!-- Dynamic News Feed List Container -->
      <div class="card-grid" id="newsFeedList">
        <!-- Rendered dynamically via js/main.js -->
      </div>
    </div>
  </section>

  <!-- Shared Site Footer Container -->
  <div id="siteFooter"></div>

  <script src="js/main.js"></script>
</body>
</html>
